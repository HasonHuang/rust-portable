name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version file
        run: |
          version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '\r\n' < VERSION)"
          if [ "$version" != "$file_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($file_version)." >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "rust-portable $GITHUB_REF_NAME" \
              --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "rust-portable $GITHUB_REF_NAME" \
              --generate-notes
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Windows toolchain
        shell: pwsh
        run: ./scripts/prepare-windows.ps1

      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $asset = "dist/rust-portable-v$version-windows-x64.zip"
          gh release upload "$env:GITHUB_REF_NAME" $asset "dist/SHA256SUMS" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }

  publish:
    needs:
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
