name: Release

# The release version is always the Rust version in VERSION.
# - Push a tag v<rust-version> to release that commit.
# - Run the workflow manually to build VERSION and create the tag automatically.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      revision:
        description: 'Optional packaging revision, for example r2. Leave empty for a normal release.'
        type: string
        default: ''
      draft:
        description: 'Create the release as a draft instead of publishing it'
        type: boolean
        default: false
      dry_run:
        description: 'Build and upload an Actions artifact only; do not create a tag or release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      asset_version: ${{ steps.version.outputs.asset_version }}
      tag: ${{ steps.version.outputs.tag }}
      draft: ${{ steps.version.outputs.draft }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the Rust version from VERSION
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain MAJOR.MINOR.PATCH, got '$version'." >&2
            exit 1
          fi

          revision="$(printf '%s' "${INPUT_REVISION:-}" | tr -d '[:space:]')"

          if [ "$EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" = "v$version" ]; then
              revision=""
            else
              revision_pattern="^v${version//./\\.}-(r[0-9]+)$"
              if [[ "$tag" =~ $revision_pattern ]]; then
                revision="${BASH_REMATCH[1]}"
              else
                echo "Tag $tag does not match VERSION ($version)." >&2
                echo "Use v$version, or v$version-r<N> for a packaging revision." >&2
                exit 1
              fi
            fi
          else
            if [ -n "$revision" ] && ! [[ "$revision" =~ ^r[0-9]+$ ]]; then
              echo "revision must look like r<N>, for example r2." >&2
              exit 1
            fi
            tag="v$version"
            if [ -n "$revision" ]; then
              tag="v$version-$revision"
            fi
          fi

          asset_version="$version"
          if [ -n "$revision" ]; then
            asset_version="$version-$revision"
          fi

          draft="${INPUT_DRAFT:-false}"
          if [ "$draft" != "true" ]; then
            draft="false"
          fi

          dry_run="${INPUT_DRY_RUN:-false}"
          if [ "$dry_run" != "true" ]; then
            dry_run="false"
          fi

          if [ "$dry_run" = "true" ]; then
            echo "Dry run enabled: skipping tag and release checks."
          elif gh release view "$tag" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            existing_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$existing_draft" != "true" ]; then
              echo "Release $tag already exists and is published." >&2
              echo "To repackage the same Rust version, use a new revision tag, for example v$version-r3." >&2
              echo "To test the workflow without releasing, run it with dry_run=true." >&2
              exit 1
            fi
            echo "A draft release for $tag already exists and will be reused."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists but has no release." >&2
            echo "Delete the tag, or use a new revision tag." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "asset_version=$asset_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "Release tag **$tag**, Rust $version, asset version $asset_version. Dry run: $dry_run." >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build Windows x64 package
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Windows toolchain (Rust ${{ needs.resolve.outputs.version }})
        shell: pwsh
        run: ./scripts/prepare-windows.ps1 -RustVersion "${{ needs.resolve.outputs.version }}"

      - name: Build package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version "${{ needs.resolve.outputs.version }}" -Revision "${{ needs.resolve.outputs.revision }}"

      - name: Write build summary
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          REVISION: ${{ needs.resolve.outputs.revision }}
          ASSET_VERSION: ${{ needs.resolve.outputs.asset_version }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
        run: |
          $sums = (Get-Content -LiteralPath 'dist/SHA256SUMS' -Raw).TrimEnd()
          @(
            "### rust-portable v$env:ASSET_VERSION",
            "",
            "- Rust version: $env:VERSION",
            "- Packaging revision: $env:REVISION",
            "- Dry run: $env:DRY_RUN",
            "- Artifact: rust-portable-v$env:ASSET_VERSION-windows-x64.zip",
            "",
            '```',
            $sums,
            '```'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-portable-windows-x64
          path: |
            dist/rust-portable-v${{ needs.resolve.outputs.asset_version }}-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux:
    name: Build Linux x64 installer
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Linux components (Rust ${{ needs.resolve.outputs.version }})
        shell: bash
        run: bash scripts/prepare-linux.sh --version "${{ needs.resolve.outputs.version }}"

      - name: Build installer
        shell: bash
        run: bash scripts/build-linux.sh --version "${{ needs.resolve.outputs.version }}" --revision "${{ needs.resolve.outputs.revision }}"

      - name: Test the installer offline
        shell: bash
        run: bash scripts/test-linux-docker.sh --bundle "dist/rust-portable-v${{ needs.resolve.outputs.asset_version }}-linux-x64.tar.gz"

      - name: Write build summary
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          REVISION: ${{ needs.resolve.outputs.revision }}
          ASSET_VERSION: ${{ needs.resolve.outputs.asset_version }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
        run: |
          {
            echo "### rust-portable v$ASSET_VERSION (Linux x64)"
            echo ""
            echo "- Rust version: \`$VERSION\`"
            echo "- Packaging revision: \`$REVISION\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Artifact: \`rust-portable-v$ASSET_VERSION-linux-x64.tar.gz\`"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.linux
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-portable-linux-x64
          path: |
            dist/rust-portable-v${{ needs.resolve.outputs.asset_version }}-linux-x64.tar.gz
            dist/SHA256SUMS.linux
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - resolve
      - build-windows
      - build-linux
    if: needs.resolve.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-portable-windows-x64
          path: dist

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-portable-linux-x64
          path: dist

      - name: Merge checksums
        run: |
          set -euo pipefail
          cat dist/SHA256SUMS dist/SHA256SUMS.linux > dist/SHA256SUMS.merged
          mv dist/SHA256SUMS.merged dist/SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          DRAFT: ${{ needs.resolve.outputs.draft }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          notes="docs/release-notes/${TAG}.md"
          draft_args=()
          if [ "$DRAFT" = "true" ]; then
            draft_args=(--draft)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing the existing draft release $TAG."
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --title "rust-portable $TAG" --notes-file "$notes"
            fi
          else
            target_args=()
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
                echo "Tag $TAG already exists. Bump VERSION or delete the tag first." >&2
                exit 1
              fi
              target_args=(--target "$GITHUB_SHA")
            else
              target_args=(--verify-tag)
            fi

            if [ -f "$notes" ]; then
              gh release create "$TAG" \
                --title "rust-portable $TAG" \
                --notes-file "$notes" \
                "${target_args[@]}" \
                "${draft_args[@]}"
            else
              gh release create "$TAG" \
                --title "rust-portable $TAG" \
                --generate-notes \
                "${target_args[@]}" \
                "${draft_args[@]}"
            fi
          fi

          gh release upload "$TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS --clobber

          if [ "$DRAFT" != "true" ]; then
            gh release edit "$TAG" --draft=false
          fi

      - name: Write job summary
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ASSET_VERSION: ${{ needs.resolve.outputs.asset_version }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "### rust-portable $TAG"
            echo ""
            echo "- Rust version: \`$VERSION\`"
            echo "- Windows: \`rust-portable-v$ASSET_VERSION-windows-x64.zip\`"
            echo "- Linux: \`rust-portable-v$ASSET_VERSION-linux-x64.tar.gz\`"
            echo "- Release: $SERVER_URL/$REPOSITORY/releases/tag/$TAG"
            echo ""
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
